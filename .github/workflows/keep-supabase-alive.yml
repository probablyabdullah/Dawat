# Supabase's free plan pauses a project after 7 days without activity.
# This job makes one tiny read against the database every 3 days so that never happens.
#
# Setup: in the GitHub repo go to Settings -> Secrets and variables -> Actions and add
#   SUPABASE_URL       e.g. https://your-project-ref.supabase.co
#   SUPABASE_ANON_KEY  the anon / public key (the same one the app uses)
#
# If the request fails (project paused, wrong key, missing table permission) the run goes red
# and GitHub emails you, so a failing run is also an early warning.
name: Keep Supabase alive

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC every 3rd day of the month
  workflow_dispatch: # lets you run it by hand from the Actions tab to test

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the restaurants table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase responded OK"
